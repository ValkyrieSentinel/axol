[package]
name = "axol_core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "axol_core"
path = "src/main.rs"

[dependencies]
aya = "0.14"
aya-log = "0.1"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
env_logger = "0.10"
ctrlc = "3.4"
num_cpus = "1.16"
log = "0.4"